name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed 2026-09-30
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5, reviewed 2026-09-30
      - run: python3 scripts/validate.py
      - run: python3 scripts/build.py
        env:
          BASE: ${{ steps.pages.outputs.base_path }}/
          SIGNUP_FORM_URL: ${{ vars.SIGNUP_FORM_URL }}
          ANALYTICS_PROVIDER: ${{ vars.ANALYTICS_PROVIDER }}
          ANALYTICS_SITE_ID: ${{ vars.ANALYTICS_SITE_ID }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3, reviewed 2026-09-30
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4, reviewed 2026-09-30
